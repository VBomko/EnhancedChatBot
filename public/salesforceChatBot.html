<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1">
</head>
<body>
    <div id="url-test-buttons" style="font-family:sans-serif;padding:10px 12px;background:#eef2ff;border-bottom:1px solid #c7d2fe;margin-bottom:8px;">
        <span style="margin-right:10px;font-weight:600;color:#3730a3;">URL test</span>
        <button type="button" onclick="setTestUrl('/google')" style="margin-right:6px;padding:6px 12px;cursor:pointer;">Google</button>
        <button type="button" onclick="setTestUrl('/youtube')" style="margin-right:6px;padding:6px 12px;cursor:pointer;">YouTube</button>
    </div>
     <script type='text/javascript'>
        var TEST_SITE_ORIGIN = 'https://enhancedchatbot-nwla.onrender.com';
        
        // only for testing purposes
        function setTestUrl(path) {
            if (path.charAt(0) !== '/') path = '/' + path;
            var targetUrl = TEST_SITE_ORIGIN + path;

            // Try to update the top browser tab URL first (works in same-origin embedding).
            try {
                if (window.top && window.top !== window) {
                    window.top.history.pushState(null, '', targetUrl);
                    console.log('Top tab URL after test button:', window.top.location.href);
                    return;
                }
            } catch (e) {
                console.warn('Could not update top tab URL directly:', e.message);
            }

            // Fallback for top-level pages.
            if (window.location.origin === new URL(TEST_SITE_ORIGIN).origin) {
                window.history.pushState(null, '', path);
            } else {
                window.location.href = targetUrl;
                return;
            }
            console.log('Current page URL after test button:', window.location.href);
        }

        /** Logs current page + parent URL when chat UI opens (see Salesforce Enhanced Web Chat event listeners). */
        function handleChatInitContext(reason) {
            var parentUrl = '(not in iframe)';
            if (window.parent !== window) {
                try {
                    parentUrl = window.parent.location.href;
                } catch (e) {
                    parentUrl = document.referrer || '(parent URL unavailable — cross-origin)';
                }
            }
            console.log('💬 Chat window — ' + reason + ' | page URL:', window.location.href, '| parent URL:', parentUrl);

            sendMessageToLWC({
                action: 'CHAT_INIT_CONTEXT_RESPONSE',
                pageUrl: window.location.href,
                parentUrl: parentUrl,
                timestamp: new Date().toISOString()
            });
        }

        function initEmbeddedMessaging() {
            try {


                embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
                    "Source_Page": window.location.href
                });

                embeddedservice_bootstrap.settings.language = 'en_US';
      
                // Initialize storage for IP address and region (like original code)
                window.ipAddress = null;
                window.geoIpRegion = null;
                // Set up analytics event handlers
                setupAnalyticsEvents();
                // Listen for messages from LWC
                window.addEventListener('message', function(event) {
                    console.log('📥 Embedded script received:', event.data);
                    if (event.data && event.data.action) {
                        handleLWCMessage(event.data);
                    }
                    if (event.data && event.data.data && event.data.data.eventName == 'onEmbeddedMessagingWindowClosed') {
                        window.greetingMessageClosed();
                    }
                });

                window.addEventListener("onEmbeddedMessagingWindowMaximized", (event) => {
                    console.log("Received the onEmbeddedMessagingWindowMaximized event…");
                    console.log("Event detail: ", event.detail);
                  
                    // Do something...
                    postIframeDisable();
                });

                window.addEventListener("onEmbeddedMessagingConversationParticipantChanged", (event) => {
                    console.log("Received the onEmbeddedMessagingConversationParticipantChanged event…");
                    console.log("Event detail: ", event.detail);
                  
                    // Parse the event detail to check if an agent joined
                    try {
                        // The actual payload is in conversationEntry.entryPayload as a JSON string
                        const entryPayload = event.detail?.conversationEntry?.entryPayload;
                        
                        if (entryPayload) {
                            const payload = JSON.parse(entryPayload);
                            const entries = payload.entries || [];
                            
                            // Check each entry to see if an agent is joining
                            entries.forEach(entry => {
                                if (entry.operation === "add" && 
                                    entry.participant?.role === "Agent") {
                                    console.log("🔒 Agent joined - enabling input for:", entry.displayName);
                                    postIframeEnable();
                                } else if (entry.operation === "remove" && 
                                           entry.participant?.role === "Agent") {
                                    console.log("🔓 Agent left - disabling input for:", entry.displayName);
                                    // Optionally enable input when agent leaves
                                    postIframeDisable();
                                }
                            });
                        }
                    } catch (error) {
                        console.error("Error processing participant changed event:", error);
                    }
                });


                // Initialize Embedded Messaging
               window.embeddedservice_bootstrap.init(
                   '00DH30000000naQ',
                    'Render',
                    'https://megaport--peeklogicd.sandbox.my.site.com/ESWRender1762778032713',
                    {
                      scrt2URL: 'https://megaport--peeklogicd.sandbox.my.salesforce-scrt.com'
                    }
                  );
                  //embeddedservice_bootstrap.init(
                  //  '00D8r000009Fsyz',
                    //'Sales_Chat_1',
                    //'https://megaport--pldschatdt.sandbox.my.site.com/ESWSalesChat1763986000547',
                   //{
                        //scrt2URL: 'https://megaport--pldschatdt.sandbox.my.salesforce-scrt.com'
                    //}
                //);   
   
                  console.log('✅ Embedded Messaging initialized');
                } catch (err) {
                console.error('Error loading Embedded Messaging: ', err);
            }
        }

        function fetchIPAddress() {
            console.log('🔄: Fetching IP address...');
            fetch('https://api.ipify.org?format=json')
                .then(response => response.json())
                .then(data => {
                    // Store in window object (like original code)
                    window.ipAddress = data.ip;
                    console.log('✅ IP Address fetched and stored:', window.ipAddress);
                    console.log('window.ipAddress from Embedded:', window.ipAddress);
                    // Send IP to LWC
                    sendMessageToLWC({
                        action: 'IP_ADDRESS_RESPONSE',
                        ipAddress: data.ip,
                        timestamp: new Date().toISOString()
                    });
                })
                .catch(error => {
                    console.error(':x: Error fetching IP:', error);
                    window.ipAddress = null;
                    // Send error to LWC
                    sendMessageToLWC({
                        action: 'IP_ADDRESS_ERROR',
                        error: error.message,
                        timestamp: new Date().toISOString()
                    });
                });
        }

        function sendMessageToLWC(data) {
            // Find the iframe containing the LWC component
            const lwcIframe = document.getElementById('embeddedMessagingFrame');
            if (lwcIframe && lwcIframe.contentWindow) {
                lwcIframe.contentWindow.postMessage(data, '*');
                console.log('📤 Sent to LWC:', data);
            } else {
                // If iframe not immediately available, try again after a delay
                console.log('⏳ LWC iframe not found, retrying...');
                setTimeout(() => {
                    const retryIframe = document.getElementById('embeddedMessagingFrame');
                    if (retryIframe && retryIframe.contentWindow) {
                        retryIframe.contentWindow.postMessage(data, '*');
                        console.log('📤 Sent to LWC (retry):', data);
                    } else {
                        console.error('❌ Could not find LWC iframe');
                    }
                }, 1000);
            }
        }

        function handleLWCMessage(data) {
            switch (data.action) {
                case 'GET_IP_ADDRESS':
                    console.log('📨: LWC requested IP address');
                    // If IP already fetched, send it immediately
                    if (window.ipAddress) {
                        console.log('✅ IP already available, sending to LWC:', window.ipAddress);
                        sendMessageToLWC({
                            action: 'IP_ADDRESS_RESPONSE',
                            ipAddress: window.ipAddress,
                            timestamp: new Date().toISOString()
                        });
                    } else {
                        // Otherwise fetch it
                        fetchIPAddress();
                    }
                    break;
                case 'ANALYTICS_EVENT':
                    handleAnalyticsEvent(data.eventType, data.detail);
                    break;
                case 'REGION_FETCHED':
                    // Store region in window object (like original code)
                    window.geoIpRegion = data.region;
                    console.log('✅ Region received from LWC and stored:', window.geoIpRegion);
                    console.log('window.geoIpRegion from Embedded:', window.geoIpRegion);
                    break;
                case 'GET_CHAT_INIT_CONTEXT':
                    handleChatInitContext(data.pageUrl, data.parentUrl);
                    break;
                default:
                    console.log('Unknown action from LWC:', data.action);
            }
        }
        function handleAnalyticsEvent(eventType, detail) {
            console.log('📊 Handling analytics event:', eventType, detail);
            if ( window[eventType]) {
                window[eventType]({ detail: detail });
            } else {
                console.warn('⚠️ Analytics event handler not found:', eventType);
            }
        }
        function setupAnalyticsEvents() {
            // Start Conversation Event
            window.startConversation = function(event) {
                if (typeof window.analytics!='undefined')
                window.analytics.track('startConversation', {
                        eventCategory: 'Chat',
                        eventAction: 'Start Conversation',
                        eventLabel: event.detail ? event.detail.conversationId : 'Unknown'
                });
                console.log('📊 Start Conversation tracked');
            };

            
            // Email Capture Event
            window.emailCapture = function (event) {
                if (window.analytics &&
                window.OnetrustActiveGroups &&
                window.OnetrustActiveGroups.includes('C0004') &&
                event.detail &&
                event.detail.email) {
                    window.analytics.track(
                    'Chat Engaged',
                    { chat_source: 'salesforce', chat_action: 'email captured' }
                    );
                    window.analytics.identify({ 'email': event.detail.email });
                }
                console.log('📊 Email Capture tracked');
            };

            // Phone Number Capture Event
            window.phoneNumberCapture = function (event) {
                if (window.analytics &&
                window.OnetrustActiveGroups &&
                window.OnetrustActiveGroups.includes('C0004') &&
                event.detail &&
                event.detail.phoneNumber) {
                    window.analytics.track(
                    'Chat Engaged',
                    { chat_source: 'salesforce', chat_action: 'phone number captured' }
                    );
                    window.analytics.identify({ 'phone': event.detail.phoneNumber });
                }
                console.log('📊 Phone Number Capture tracked');
            };

            // Calendar Booked Event
            window.calendarBooked = function (event) {
                if (window.analytics &&
                window.OnetrustActiveGroups &&
                window.OnetrustActiveGroups.includes('C0004')) {
                window.analytics.track(
                    'Chat Engaged',
                    { chat_source: 'salesforce', chat_action: 'calendar booked' }
                );
                }

                console.log('📊 Calendar Booked tracked');
            };

            // Calendar Link Clicked Event
            window.calendarLinkClicked = function (event) {
                if (window.analytics &&
                window.OnetrustActiveGroups &&
                window.OnetrustActiveGroups.includes('C0004')) {
                window.analytics.track(
                    'Chat Engaged',
                    { chat_source: 'salesforce', chat_action: 'calendar link clicked' }
                );
                }

                console.log('📊 Calendar Link Clicked tracked');
            };

            // Button Clicked Event
            window.buttonClicked = function (event) {
                buttonName = event.detail ? event.detail.buttonName : 'Unknown';
                if (window.analytics &&
                window.OnetrustActiveGroups &&
                window.OnetrustActiveGroups.includes('C0004')) {
                window.analytics.track(
                    'Chat Engaged',
                    { chat_source: 'salesforce', chat_action: `${buttonName} button clicked`}
                );
                }

                console.log('📊 Button Clicked tracked:', buttonName);
            };

            // Greeting Message Closed Event
            window.greetingMessageClosed = function (event) {
                if (window.analytics &&
                window.OnetrustActiveGroups &&
                window.OnetrustActiveGroups.includes('C0004')) {
                window.analytics.track(
                    'Chat Engaged',
                    { chat_source: 'salesforce', chat_action: 'greeting message closed' }
                );
                }
                console.log('📊 Greeting Message Closed tracked');
            };

              // Live Agent Unavailable Event
            window.liveAgentUnavailable = function (event) {
                if (window.analytics &&
                window.OnetrustActiveGroups &&
                window.OnetrustActiveGroups.includes('C0004')) {
                    window.analytics.track(
                    'Chat Engaged',
                    { chat_source: 'salesforce', chat_action: 'live agent unavailable' }
                    );
                }  
                console.log('📊 Live Agent Unavailable tracked');
            };
            console.log('✅ Analytics events set up');
        }

        // Function to disable user input in the iframe
        function postIframeDisable() {
            const iframe = document.getElementById("embeddedMessagingFrame");
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage('InputDisable', '*');
                console.log('📤 Sent InputDisable to iframe');
            }
        }

        // Function to enable user input in the iframe
        function postIframeEnable() {
            const iframe = document.getElementById("embeddedMessagingFrame");
            if (iframe && iframe.contentWindow) {
                iframe.contentWindow.postMessage('InputEnable', '*');
                console.log('📤 Sent InputEnable to iframe');
            }
        }
    </script>

</body>
